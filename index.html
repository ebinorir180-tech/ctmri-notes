<!DOCTYPE html>
<html lang="ja" class="ui-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1014">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="症例ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CT・MRI 救急症例ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* 読影室の暗さ：濃紺の地＋ティール。所見はアンバー、解剖はシアン。左に一覧、右に画像と解説 */
:root{
  --paper:#0b1014; --panel:#141c22; --ink:#e4ebee; --muted:#93a4ae; --line:#26333c;
  --accent:#45b5bf; --accent-soft:#163038; --on-accent:#0b1014; --find:#e39b2d; --anat:#5fd0e2;
  --find-ui:#e39b2d; --anat-ui:#5fd0e2; --sevr:#3a4852;
  --crit:#e2655b; --urg:#e39545; --rout:#93a4ae; --ok:#5cbf83;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
/* 表示テーマ：html に ui-dark / ui-light / ui-auto のクラスを付けて切り替える（模式図の注釈色は常に明るいまま） */
:root.ui-light{
  --paper:#f2f5f6; --panel:#ffffff; --ink:#15212b; --muted:#5b6b76; --line:#d6dee3;
  --accent:#0d7480; --accent-soft:#e1f0f1; --on-accent:#ffffff; --find-ui:#b8740f; --anat-ui:#1c8fa3; --sevr:#d6dee3;
  --crit:#b83229; --urg:#c9701a; --rout:#5b6b76; --ok:#2f7d4f;
  color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root.ui-auto{
    --paper:#f2f5f6; --panel:#ffffff; --ink:#15212b; --muted:#5b6b76; --line:#d6dee3;
    --accent:#0d7480; --accent-soft:#e1f0f1; --on-accent:#ffffff; --find-ui:#b8740f; --anat-ui:#1c8fa3; --sevr:#d6dee3;
    --crit:#b83229; --urg:#c9701a; --rout:#5b6b76; --ok:#2f7d4f;
    color-scheme:light;
  }
}
.themesw{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.themesw button{border:0;background:transparent;border-radius:999px;padding:3px 11px;font-size:.78rem;color:var(--muted)}
.themesw button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.topright{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{padding-top:max(16px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:16px clamp(16px,3vw,32px);border-bottom:1px solid var(--line);background:var(--panel)}
.brand h1{font-size:1.3rem}
.brand p{margin:0;color:var(--muted);font-size:.82rem}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:transparent;padding:6px 14px;border-radius:999px;font-size:.88rem}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}

main{padding:20px clamp(16px,3vw,32px) 40px;max-width:1280px;margin:0 auto}
.view[hidden]{display:none}

/* 図鑑 */
.atlas{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.atlas{grid-template-columns:1fr}}
.search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;margin-bottom:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel);padding:3px 11px;border-radius:999px;font-size:.8rem;line-height:1.6}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.chip .n{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-left:3px}
.caselist{display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 230px);overflow:auto;padding-right:4px}
@media (max-width:860px){.caselist{max-height:340px}}
.listhead{flex-shrink:0;font-size:.75rem;color:var(--muted);font-weight:700;margin:8px 0 2px}
.caseitem{flex-shrink:0;display:grid;grid-template-columns:5px 1fr;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px 7px 0;overflow:hidden}
.caseitem strong{display:block;font-size:.9rem;line-height:1.4;font-weight:500}
.caseitem small{color:var(--muted);font-size:.74rem}
.caseitem[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sev-crit{background:var(--crit)} .sev-urg{background:var(--urg)} .sev-rout{background:var(--sevr)}
.count{font-size:.78rem;color:var(--muted);margin-bottom:4px}
.modfilter{border-top:1px solid var(--line);padding-top:8px;margin-bottom:10px}
.modfilter .lab{font-size:.74rem;color:var(--muted);margin-bottom:4px;display:block}
.modfilter .row{display:flex;gap:6px;flex-wrap:wrap}
.modfilter .sub{margin-top:6px;padding-left:10px;border-left:2px solid var(--accent-soft)}
.modfilter .sub .chip{font-size:.75rem;padding:2px 9px}
.modtag{display:inline-block;font-size:.7rem;padding:0 6px;border-radius:4px;border:1px solid var(--line);margin-left:4px;color:var(--muted)}

.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,2.5vw,26px)}
.dhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-bottom:14px}
.dhead h2{font-size:1.45rem}
.tag{font-size:.75rem;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.crit{border-color:var(--crit);color:var(--crit);font-weight:700}
.tag.urg{border-color:var(--urg);color:var(--urg);font-weight:700}
.dgrid{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:24px;align-items:start}
@media (max-width:1040px){.dgrid{grid-template-columns:1fr}}
.imgpanel{position:sticky;top:12px}
.scanwrap{background:#000;border-radius:10px;overflow:hidden;max-width:400px}
svg.scan{display:block;width:100%;height:auto}
svg.scan .ann,svg.scan .anat{display:none}
svg.scan.show-ann .ann,svg.scan.show-anat .anat{display:inline}
svg.scan text{font-family:var(--body);font-size:8.6px;font-weight:700;paint-order:stroke;stroke:#000;stroke-width:2.6px}
svg.scan .ann text{fill:var(--find)}
svg.scan .ann line,svg.scan .ann .ol{stroke:var(--find);stroke-width:1.3;fill:none}
svg.scan .ann circle.dot{fill:var(--find)}
svg.scan .anat text{fill:var(--anat)}
svg.scan .anat line{stroke:var(--anat);stroke-width:.9;opacity:.85}
svg.scan .anat circle.dot{fill:var(--anat)}
svg.scan .quizmark circle{fill:none;stroke:var(--anat);stroke-width:2}
svg.scan .quizmark circle+circle{fill:var(--anat)}
.imgtools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.layer{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.layer button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 10px;font-size:.8rem;display:inline-flex;align-items:center;gap:6px}
.layer button::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid currentColor}
.layer button.find{color:var(--find-ui)} .layer button.anatb{color:var(--anat-ui)}
.layer button[aria-pressed="true"]::before{background:currentColor}
.caption{font-size:.8rem;color:var(--muted);margin:8px 0 0;line-height:1.65}
.wl{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin:6px 0 0}
.tplname{font-size:.74rem;color:var(--muted);margin-top:6px}

.sections{display:flex;flex-direction:column;gap:16px;max-width:68ch}
.sections h3{font-size:1rem;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.sections h3::before{content:"";width:4px;height:1em;background:var(--accent);border-radius:2px}
.sections ul{margin:0;padding-left:1.2em}
.sections li+li{margin-top:2px}
.alert{border:1px solid var(--crit);border-left-width:5px;border-radius:8px;padding:10px 14px;background:color-mix(in srgb,var(--crit) 6%,var(--panel))}
.alert h3::before{background:var(--crit)}
.tech{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--accent-soft)}
.keychips{display:flex;flex-wrap:wrap;gap:5px}

/* 症状検索 */
.symwrap{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);gap:22px;align-items:start}
@media (max-width:900px){.symwrap{grid-template-columns:1fr}}
.symgroup{margin-bottom:12px}
.symgroup h3{font-size:.85rem;color:var(--muted);margin-bottom:5px}
.symgroup .chips{display:flex;flex-wrap:wrap;gap:5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.selected{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px;margin-bottom:10px}
.results{display:flex;flex-direction:column;gap:8px}
.result-item{display:grid;grid-template-columns:5px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 12px 9px 0;overflow:hidden}
.result-item strong{display:block;font-weight:700;font-size:.95rem}
.result-item small{color:var(--muted);font-size:.76rem;display:block}
.match{font-family:var(--mono);font-size:.82rem;color:var(--accent);white-space:nowrap}
.bar{height:4px;border-radius:2px;background:var(--accent-soft);margin-top:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.hint{color:var(--muted);font-size:.85rem}

/* クイズ */
.quiz{max-width:900px;margin:0 auto}
.qsetup{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:14px}
.qsetup fieldset{border:0;padding:0;margin:0}
.qsetup legend{font-size:.78rem;color:var(--muted);margin-bottom:4px}
.qbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.progress{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,2.5vw,26px);display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:22px;align-items:start}
.qcard.noimg{grid-template-columns:1fr}
@media (max-width:720px){.qcard{grid-template-columns:1fr}}
.qcard .kind{font-size:.75rem;color:var(--accent);font-weight:700;letter-spacing:.04em}
.qcard h2{font-size:1.1rem;margin:2px 0 12px}
.qcard .stem{margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:.92rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;line-height:1.55}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel));font-weight:700}
.opt.wrong{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,var(--panel))}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--accent-soft);font-size:.92rem}
.feedback b.good{color:var(--ok)} .feedback b.bad{color:var(--crit)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:7px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.result{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px}
.result .score{font-family:var(--mono);font-size:2.4rem;color:var(--accent)}
.intro{color:var(--muted);font-size:.9rem;max-width:70ch;margin:0 0 14px}

footer{max-width:1280px;margin:0 auto;padding:0 clamp(16px,3vw,32px) 32px;color:var(--muted);font-size:.78rem}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.caseitem,.result-item{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>CT・MRI 救急症例ノート</h1>
    <p>新人診療放射線技師のための症例学習（試作版 v0.4・100症例）</p>
  </div>
  <div class="topright">
  <div class="themesw" role="group" aria-label="表示テーマ">
    <button data-theme-set="light">ライト</button><button data-theme-set="dark">ダーク</button><button data-theme-set="auto">端末に合わせる</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="モード">
    <button role="tab" aria-selected="true" data-view="atlas">症例図鑑</button>
    <button role="tab" aria-selected="false" data-view="symptom">症状から探す</button>
    <button role="tab" aria-selected="false" data-view="quiz">クイズ</button>
    <button role="tab" aria-selected="false" data-view="report">緊急所見トレーニング</button>
  </nav>
  </div>
</header>

<main>
  <section class="view" id="view-atlas">
    <div class="atlas">
      <aside>
        <input class="search" id="q" type="search" placeholder="疾患名・略語・撮像法で検索（例：SAH、解離、DWI）" aria-label="症例を検索">
        <div class="filters" id="filters"></div>
        <div class="modfilter" id="modfilter" aria-label="モダリティで絞り込み"></div>
        <div class="count" id="count"></div>
        <div class="caselist" id="caselist"></div>
      </aside>
      <article class="detail" id="detail"></article>
    </div>
  </section>

  <section class="view" id="view-symptom" hidden>
    <p class="intro">当てはまる症状・背景を選ぶと、疑われる疾患を一致数の多い順に表示します。学習用の目安で、診断ツールではありません。</p>
    <div class="symwrap">
      <div class="panel" id="symchips"></div>
      <div class="panel">
        <div class="selected" id="symselected"></div>
        <div class="results" id="symresults"></div>
      </div>
    </div>
  </section>

  <section class="view" id="view-quiz" hidden>
    <div class="quiz">
      <div class="qsetup" id="qsetup"></div>
      <div id="quiz-root"></div>
    </div>
  </section>

  <section class="view" id="view-report" hidden>
    <div class="quiz">
      <p class="intro">撮影中・撮影直後に気づいた所見に対して、技師としてどう動くかを考える練習です。対応の最終判断は施設のルールと医師の指示に従ってください。</p>
      <div class="qsetup" id="rsetup"></div>
      <div id="report-root"></div>
    </div>
  </section>
</main>

<footer>
  画像はすべて学習用に単純化した模式図で、実際の濃度・形態・断面とは異なります（解剖は各テンプレートの代表的な構造のみ）。内容は教育目的の一般的な知識で、撮像条件・ウィンドウ値は目安です。各施設のプロトコルと医師の判断を優先してください。
</footer>

<script>/* templates.js */
/* 模式図テンプレート
   各テンプレートは (p, o) => {under, over, anat} を返す。
   p: 撮像条件ごとの色（PAL）、o: オプション。
   症例の病変（les）は under と over の間に描かれ、{key} は p[key] に置き換わる。
   anat: [x, y, tx, ty, 名前] 解剖ラベル（構造上の点 → ラベル位置）。 */

const BASE_KEYS = {bone:0,marrow:0,wm:0,gm:0,csf:0,fat:0,soft:0,organ:0,air:0,lung:0,blood:0,vessel:0,fluid:0,lig:0,disc:0,nucleus:0,cord:0,cart:0,lens:0};

const PAL = {
  CT:   {bone:"#ececec",marrow:"#bdbdbd",wm:"#7a7a7a",gm:"#8a8a8a",csf:"#2c2c2c",fat:"#383838",soft:"#696969",organ:"#858585",air:"#030303",lung:"#141414",blood:"#d8d8d8",vessel:"#8a8a8a",fluid:"#535353",lig:"#6a6a6a",disc:"#757575",nucleus:"#757575",cord:"#747474",cart:"#6a6a6a",lens:"#a6a6a6"},
  CTL:  {bone:"#ffffff",marrow:"#f0f0f0",wm:"#cfcfcf",gm:"#d2d2d2",csf:"#bdbdbd",fat:"#a2a2a2",soft:"#c6c6c6",organ:"#cacaca",air:"#000000",lung:"#2c2c2c",blood:"#d6d6d6",vessel:"#cccccc",fluid:"#c0c0c0",lig:"#c6c6c6",disc:"#c8c8c8",nucleus:"#c8c8c8",cord:"#c8c8c8",cart:"#c6c6c6",lens:"#d0d0d0"},
  CTB:  {bone:"#f4f4f4",marrow:"#8c8c8c",wm:"#5c5c5c",gm:"#5e5e5e",csf:"#525252",fat:"#4a4a4a",soft:"#5c5c5c",organ:"#5e5e5e",air:"#000000",lung:"#0a0a0a",blood:"#606060",vessel:"#5e5e5e",fluid:"#565656",lig:"#5c5c5c",disc:"#5e5e5e",nucleus:"#5e5e5e",cord:"#5e5e5e",cart:"#5c5c5c",lens:"#606060"},
  T1:   {bone:"#141414",marrow:"#cacaca",wm:"#9c9c9c",gm:"#727272",csf:"#2a2a2a",fat:"#e4e4e4",soft:"#545454",organ:"#7a7a7a",air:"#000000",lung:"#080808",blood:"#808080",vessel:"#1a1a1a",fluid:"#2e2e2e",lig:"#121212",disc:"#6a6a6a",nucleus:"#6a6a6a",cord:"#7c7c7c",cart:"#707070",lens:"#7a7a7a"},
  T2:   {bone:"#121212",marrow:"#9a9a9a",wm:"#5a5a5a",gm:"#7c7c7c",csf:"#f0f0f0",fat:"#bcbcbc",soft:"#444444",organ:"#5a5a5a",air:"#000000",lung:"#0a0a0a",blood:"#3a3a3a",vessel:"#0e0e0e",fluid:"#ececec",lig:"#0c0c0c",disc:"#3c3c3c",nucleus:"#e6e6e6",cord:"#7a7a7a",cart:"#8e8e8e",lens:"#2a2a2a"},
  FLAIR:{bone:"#121212",marrow:"#9a9a9a",wm:"#6a6a6a",gm:"#7e7e7e",csf:"#1e1e1e",fat:"#bcbcbc",soft:"#444444",organ:"#5a5a5a",air:"#000000",lung:"#0a0a0a",blood:"#555555",vessel:"#0e0e0e",fluid:"#2a2a2a",lig:"#0c0c0c",disc:"#3c3c3c",nucleus:"#6a6a6a",cord:"#7a7a7a",cart:"#8e8e8e",lens:"#2a2a2a"},

const Ci = (cx,cy,r,f,x="") => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${x}/>`;
const Pa = (d,f,x="") => `<path d="${d}" fill="${f}" ${x}/>`;
const St = (d,s,w,x="") => `<path d="${d}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;
/* 楕円の輪郭パス（evenodd で三日月や輪を作る用） */
const ell = (cx,cy,rx,ry) => `M${cx-rx} ${cy} a${rx} ${ry} 0 1 0 ${2*rx} 0 a${rx} ${ry} 0 1 0 ${-2*rx} 0 `;
const ring = (a,b,f,x="") => `<path fill-rule="evenodd" d="${ell(...a)}${ell(...b)}" fill="${f}" ${x}/>`;
const mirrorX = d => d.replace(/([MLQCTA]?)(-?\d+\.?\d*) (-?\d+\.?\d*)/g, (m,c,x,y) => `${c}${240-(+x)} ${y}`);


/* ---------- 実画像らしさのための手続き的な描写 ---------- */
let CLIP = 0;
function rng(seed){ let s = seed % 2147483647 || 1; return () => { s = s * 16807 % 2147483647; return (s - 1) / 2147483646; }; }
/* 脳溝：脳表から内側へ向かう曲線 */
function sulci(cx,cy,rx,ry,col,{n=34,len=[10,18],seed=7,skip=[]}={}){
  const r = rng(seed); let d = "";
  for (let k=0;k<n;k++){
    const t = k*2*Math.PI/n + (r()-0.5)*0.12;
    if (skip.some(([a,b]) => t>a && t<b)) continue;
    const ex = cx+rx*Math.cos(t), ey = cy+ry*Math.sin(t);
    const L = len[0] + r()*(len[1]-len[0]);
    const ux = (cx-ex), uy = (cy-ey), m = Math.hypot(ux,uy); const nx = ux/m, ny = uy/m;
    const ix = ex+nx*L, iy = ey+ny*L, w = (r()-0.5)*8;
    d += `M${ex.toFixed(1)} ${ey.toFixed(1)} Q${(ex+nx*L/2-ny*w).toFixed(1)} ${(ey+ny*L/2+nx*w).toFixed(1)} ${ix.toFixed(1)} ${iy.toFixed(1)} `;
    if (r()>0.5){ const bx = ex+nx*L*0.45, by = ey+ny*L*0.45, s2 = r()>0.5?1:-1;
      d += `M${bx.toFixed(1)} ${by.toFixed(1)} l${(nx*5-ny*6*s2).toFixed(1)} ${(ny*5+nx*6*s2).toFixed(1)} `; }
  }
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>`;
}
/* 肺血管の樹状分岐（肺の楕円でクリップ） */
function vesselTree(x,y,ang,len,w,depth,r,out){
  const x2 = x+Math.cos(ang)*len, y2 = y+Math.sin(ang)*len;
  out.push(`<path d="M${x.toFixed(1)} ${y.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke-width="${w.toFixed(2)}"/>`);
  if (depth<=0) return;
  const spread = 0.35 + r()*0.35;
  vesselTree(x2,y2,ang-spread,len*(0.62+r()*0.2),w*0.66,depth-1,r,out);
  vesselTree(x2,y2,ang+spread,len*(0.62+r()*0.2),w*0.66,depth-1,r,out);
}
function lungVessels(lungs, hila, col, {seed=3, width=2.6, depth=5, opacity=1}={}){
  const r = rng(seed); let out = "";
  lungs.forEach((L,i) => {
    const id = `lc${++CLIP}`, [hx,hy,base] = hila[i], segs = [];
    [-1.1,-0.4,0.3,1.0].forEach(a => vesselTree(hx,hy,base+a+(r()-0.5)*0.3,14+r()*6,width,depth,r,segs));
    out += `<clipPath id="${id}"><ellipse cx="${L[0]}" cy="${L[1]}" rx="${L[2]}" ry="${L[3]}"/></clipPath><g clip-path="url(#${id})" stroke="${col}" stroke-linecap="round" opacity="${opacity}">${segs.join("")}</g>`;
  });
  return out;
}
/* 小脳の葉（folia） */
function folia(cx,cy,rx,ry,col){
  let d = ""; for (let i=-3;i<=3;i++){ const y = cy+i*ry/4.2, w = rx*Math.sqrt(Math.max(0,1-(i/4.2)**2))*0.9;
    d += `M${(cx-w).toFixed(1)} ${(y+2).toFixed(1)} Q${cx} ${(y-3).toFixed(1)} ${(cx+w).toFixed(1)} ${(y+2).toFixed(1)} `; }
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1" opacity="0.8"/>`;
}

function annSvg(a, cls){
  if (typeof a === "string") return `<g class="${cls}"><path class="ol" stroke-dasharray="3 2" d="${a}"/></g>`;
  const [x,y,tx,ty,t] = a;
  /* ラベルは常に画像の内側へ向かって伸ばす（右半分は右寄せ、左半分は左寄せ） */
  const anc = tx > 120 ? "end" : (tx < 120 ? "start" : "middle");
  return `<g class="${cls}"><circle class="dot" cx="${x}" cy="${y}" r="2.4"/><line x1="${x}" y1="${y}" x2="${tx}" y2="${ty}"/><text x="${tx}" y="${ty-3}" text-anchor="${anc}">${t}</text></g>`;
}
/* view: {tpl, m, les, ann, o}  opts: {hl: 解剖クイズで強調する index} */
function renderView(view, opts={}){
  const p = {...PAL[view.m] };
  const t = TPL[view.tpl].draw(p, view.o||{});
  const anat = opts.hl != null
    ? `<g class="quizmark"><circle cx="${t.anat[opts.hl][0]}" cy="${t.anat[opts.hl][1]}" r="7"/><circle cx="${t.anat[opts.hl][0]}" cy="${t.anat[opts.hl][1]}" r="2"/></g>`
    : t.anat.map(a => annSvg(a,"anat")).join("");
  const id = ++CLIP, mr = !view.m.startsWith("CT"), amp = mr ? 0.10 : 0.13;
  const defs = `<defs><filter id="fx${id}" x="0" y="0" width="240" height="240" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="${mr?0.75:0.55}" result="b"/>
    <feTurbulence type="fractalNoise" baseFrequency="${mr?0.7:0.95}" numOctaves="2" seed="${id%89}" result="t"/>
    <feColorMatrix in="t" type="matrix" values="0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1" result="g"/>
    <feComposite in="b" in2="g" operator="arithmetic" k1="0" k2="1" k3="${amp}" k4="${-amp/2}"/></filter>
    <radialGradient id="vg${id}" cx="50%" cy="50%" r="60%"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="${mr?0.5:0}"/></radialGradient></defs>`;
  const body = `<rect width="240" height="240" fill="#000"/>${t.under}${fillKeys(typeof view.les==="function"?view.les(p):view.les,p)}${t.over}`;
  return `<svg class="scan" viewBox="0 0 240 240" role="img" aria-label="${TPL[view.tpl].name}の模式図">${defs}<g filter="url(#fx${id})">${body}</g>${mr?`<rect width="240" height="240" fill="url(#vg${id})"/>`:""}${anat}${(view.ann||[]).map(a=>annSvg(a,"ann")).join("")}</svg>`;
}
function anatOf(tplName){ return TPL[tplName].draw(PAL.CT,{}).anat; }

<script>/* data-quiz.js */
/* 撮像ポイント問題（techQ）と緊急所見トレーニング（repQ）
   T(id, 問題, 正解, [誤答3つ], 解説) / R(...) 。既に設定されている症例は上書きしない。
   R の誤答を省略すると、緊急所見用の共通の誤答を使う。 */
const URG_WRONG = ["撮影をすべて終えてから報告書にまとめて伝える","よくある所見なので特に伝えない","患者さんに疑われる病名を説明する"];
const ROUT_WRONG = ["救急対応として、ただちに担当医へ電話で呼び出す","技師の判断で追加の造影検査を行う","患者さんに病名と治療方針を説明する"];
function T(id,q,ok,wr,exp){ const c = CASES.find(x=>x.id===id); if (c && !c.techQ) c.techQ = {q,opts:[ok,...wr],a:0,exp}; }
function R(id,q,ok,wr,exp){ const c = CASES.find(x=>x.id===id); if (c && !c.repQ) c.repQ = {q,opts:[ok,...(wr||URG_WRONG)],a:0,exp}; }
const NOW = "所見として直ちに医師へ伝え、撮影中も患者の状態を観察する";

/* ---- 頭部 ---- */
R("ich","抗凝固薬を内服中の患者。頭部 CT で被殻に血腫があり、大きな脳室穿破と正中偏位がある。対応は？",NOW,null,"抗凝固薬の中和や手術・ドレナージの判断に関わる所見です。");
T("lacunar","ラクナ梗塞が疑われる MRI。小さな新しい梗塞を見つけやすくする工夫は？","DWI を薄いスライスや別の断面で追加する",["T1 強調像だけで判断する","スライス厚を厚くして撮る","造影T1 を最初に撮る"],"小さな病変はスライスの隙間に入ると見えません。薄いスライスや冠状断の DWI が有効です（施設の方針で）。");
R("lacunar","片麻痺で来院。DWI で内包後脚に小さな高信号、FLAIR では白質に古い病変が多数ある。対応は？","症状に合う新しい病変（DWI 高信号）があることを医師へ伝える",["古い病変が多いので年齢相応として伝えない","FLAIR だけで新旧を判断して伝えない","翌週の再検査を予約する"],"新しい梗塞の判定は DWI です。古い病変が多くても、新しい病変は治療方針に直結します。");
T("thalamic","視床出血の CT で特に確認したい合併所見は？","脳室穿破と脳室の拡大（水頭症）",["副鼻腔の液体貯留","頭皮の厚さ","眼球の形"],"視床は脳室に接しており、脳室穿破から急性水頭症を起こしやすい部位です。");
R("thalamic","視床出血の経過観察 CT で、前回より側脳室と第3脳室が明らかに拡大している。対応は？","急性水頭症の可能性として直ちに医師へ伝える",["前回と同じ所見として伝えない","次回の経過観察まで待つ","患者さんに水頭症と説明する"],"急性水頭症は脳室ドレナージなど緊急処置の対象になりえます。");
T("cerebellar-h","後頭蓋窩の出血を CT で評価するときの注意点は？","錐体骨の間はビームハードニングで見えにくいので、薄いスライスや再構成で確認する",["肺野条件で観察する","骨条件だけで評価する","スライス厚を厚くする"],"後頭蓋窩は厚い骨に挟まれ、黒い帯状のアーチファクトが出やすい部位です。");
T("pontine-h","橋出血の患者を撮影するときに最も注意すべきことは？","呼吸状態が不安定なことが多いので、気道・モニターを確認しながら短時間で撮る",["正確な位置決めのため何度も撮り直す","一人で患者を寝台に移す","技師の判断で造影を追加する"],"脳幹の出血は呼吸・循環が急に悪化しうるため、安全確認と時間短縮が最優先です。");
R("pontine-h","意識障害の患者の CT で橋に高吸収。撮影中に呼吸が浅く不規則になってきた。対応は？","撮影を中断してでも直ちに医師・看護師を呼ぶ",["撮影を最後まで終えてから伝える","声をかけて様子を見る","体位を変えて呼吸を楽にさせ撮影を続ける"],"呼吸の変化は脳幹の障害の進行を示します。画像より患者の安全が優先です。");
T("edh","硬膜外血腫が疑われる外傷患者で、骨折線を確認する方法として適切なのは？","骨条件・薄いスライス・3D 再構成で確認する",["脳条件だけで確認する","造影 MRI を追加する","肺野条件で確認する"],"側頭骨骨折は中硬膜動脈損傷と関係します。骨条件と 3D 再構成が有用です。");
R("edh","頭部打撲後、意識がはっきりしている若年者。CT で側頭部に凸レンズ型の高吸収がある。対応は？","意識が清明でも急変しうるため直ちに医師へ伝える",["意識清明なので経過観察でよいと判断する","帰宅してよいと伝える","翌日の読影を待つ"],"硬膜外血腫は「意識清明期」のあとに急速に悪化することがあります。");
T("csdh","等吸収の慢性硬膜下血腫を見逃さないための見方は？","脳溝が頭蓋骨の内側まで届いているか、正中偏位がないかを確認する",["骨条件で観察する","肺野条件で観察する","必ず造影 CT を追加する"],"血腫が脳と同じ濃度だと境界が見えません。脳溝の消失や偏位が手がかりです。");
R("csdh","歩行障害の高齢者。CT で片側の脳溝が見えず、脳表に等吸収の三日月状の領域と正中偏位がある。対応は？","慢性硬膜下血腫の可能性として医師へ伝える",["脳萎縮として伝えない","年齢相応の変化と判断する","画質不良として撮り直す"],"慢性硬膜下血腫は手術（穿頭）で改善が期待できる疾患です。");
T("contusion","前頭葉底部の脳挫傷を見つけやすくする工夫は？","冠状断・矢状断の再構成で頭蓋底に接する部分を見る",["横断像だけを厚いスライスで見る","肺野条件で観察する","撮像範囲を頭頂部だけにする"],"前頭葉底部は頭蓋底の骨の近くでアーチファクトも出やすく、横断像だけでは見逃しやすい部位です。");
R("contusion","前日入院した脳挫傷の経過観察 CT。挫傷内の出血が拡大し、新たに正中偏位が出現した。対応は？",NOW,null,"脳挫傷は時間とともに拡大することがあり、悪化は手術の判断につながります。");
T("dai","びまん性軸索損傷の評価に最も鋭敏な撮像法は？","T2*強調像や SWI",["単純 CT","T1 強調像","造影 CT"],"微小出血は磁化率の効果で T2*/SWI に黒く写ります。CT ではほとんど見えません。");
R("dai","交通外傷後、意識障害が続く患者。頭部 CT では明らかな異常がない。対応は？","CT で説明のつかない意識障害であることを医師と共有する（MRI の検討につながる）",["CT が正常なので問題ないと判断する","患者さんに異常なしと説明する","撮影条件を変えて CT を何度も撮り直す"],"びまん性軸索損傷は CT で写りにくく、MRI で初めて分かることが多い損傷です。");
T("skull-fx","頭蓋底骨折を評価するのに有用な再構成は？","骨条件の薄いスライスで冠状断・矢状断を作る",["脳条件の横断像だけを見る","5mm の厚いスライスで再構成する","肺野条件で観察する"],"頭蓋底は複雑な形をしており、横断像だけでは骨折線が分かりにくい部位です。");
R("skull-fx","頭部外傷の CT で、頭蓋内に小さな空気（気脳症）がある。対応は？","硬膜損傷や開放性骨折を示唆するため医師へ伝える",["アーチファクトとして伝えない","正常変異として伝えない","患者さんに骨折と説明する"],"頭蓋内の空気は副鼻腔や乳突蜂巣の骨折、開放性骨折のサインです。");
T("hydro","シャント術後の患者を MRI で撮像するときに注意すべきことは？","圧可変式バルブは磁場で設定が変わることがあるので、撮像後の確認を医師と共有する",["シャントはすべて MRI 禁忌なので撮らない","特に確認することはない","撮像前にバルブを外してもらう"],"機種によっては MRI 後に設定圧の確認・再設定が必要です。");
R("hydro","シャント術後の患者が頭痛と嘔吐。前回の CT より側脳室が明らかに拡大している。対応は？","シャント不全の可能性として直ちに医師へ伝える",null,"シャント不全による急性水頭症は緊急処置が必要になることがあります。");
T("gbm","脳腫瘍の造影 MRI で、造影前後を比べやすくするために大切なことは？","造影前後で同じ断面・スライス位置・撮像条件にそろえる",["造影後は別の断面で撮る","造影後だけ撮る","造影前の撮像は省略する"],"造影効果は造影前との比較で判断します。条件がそろっていないと比べられません。");
R("gbm","頭痛で来院。MRI で大きな腫瘤と強い浮腫、正中偏位があり、撮影中に呼びかけへの反応が鈍くなってきた。対応は？","脳ヘルニアのリスクとして直ちに医師へ伝える",null,"意識レベルの低下は脳ヘルニアが進んでいるサインです。");
T("brain-mets","小さな脳転移を見つけやすくする撮像は？","薄いスライスの 3D 造影T1 強調像",["厚いスライスの 2D T2 強調像","単純 CT","造影なしの FLAIR だけ"],"小病変は薄いスライスの 3D 撮像で検出しやすくなり、治療方針（定位放射線治療など）にも影響します。");
R("brain-mets","肺癌の患者。脳 MRI で多発する造影結節の一つに出血と強い浮腫、正中偏位がある。対応は？","出血と正中偏位を伴う所見として医師へ速やかに伝える",null,"腫瘍内出血や強い浮腫は急な神経症状の悪化につながります。");
T("meningioma","髄膜腫の石灰化を評価するのに適した検査は？","CT",["T2 強調像","拡散強調像","MRA"],"石灰化は CT で白く明瞭に写ります。MRI では分かりにくいことがあります。");
R("meningioma","健診の MRI で偶然、硬膜に接する小さな均一に造影される腫瘤。患者さんは無症状。対応は？","通常の読影依頼の流れで報告する",ROUT_WRONG,"無症状の小さな髄膜腫は通常は待機的な所見です。良性・悪性などを技師から患者さんに伝えることはしません。");
T("abscess","リング状に造影される脳病変を見たとき、追加を検討すべき撮像は？","拡散強調像（DWI）",["MRA","T1 強調像だけ","造影CT"],"膿瘍は内部が DWI で高信号になり、腫瘍の壊死と区別する手がかりになります。");
R("abscess","発熱と頭痛の患者。脳にリング状造影病変があり、DWI で側脳室内にも高信号がある。対応は？","脳室穿破の可能性として直ちに医師へ伝える",null,"脳膿瘍の脳室穿破は重篤な合併症です。");
T("hsv","発熱と意識障害でヘルペス脳炎が疑われるとき、特に重要な撮像は？","FLAIR と DWI",["MRA だけ","頸椎の T2 強調像","単純 CT だけで十分"],"側頭葉内側の FLAIR・DWI 高信号が早期診断の手がかりです。CT は初期に正常なことが多い。");
R("hsv","発熱・異常行動の患者。MRI で側頭葉内側に FLAIR 高信号がある。対応は？","早期治療につながる所見として速やかに医師へ伝える",null,"ヘルペス脳炎は抗ウイルス薬の開始が早いほど予後がよくなります。");
T("ms","多発性硬化症で脳梁の病変を評価するのに適した撮像は？","矢状断の FLAIR",["冠状断の T1 強調像","横断の DWI だけ","MRA"],"脳梁の病変は脳室に接していて横断では分かりにくく、矢状断 FLAIR が有用です。");
R("ms","経過観察中の多発性硬化症の患者。造影 MRI で新たに造影される病変がある。対応は？","新しい活動性病変として担当医に確実に伝わるようにする",["病変数が多いので特に伝えない","患者さんに再発と説明する","技師の判断で撮像を追加し続ける"],"造影される新病変は活動性を示し、治療変更の判断材料になります。");
T("cvst","脳静脈洞血栓症の評価で造影のタイミングとして適切なのは？","静脈相（CT venography / MR venography）",["早期の動脈相だけ","造影はしない","造影 10 分後だけ"],"静脈洞の造影欠損を見るには、静脈が十分に造影される時相で撮ります。");
R("cvst","若年女性の頭痛。CT で上矢状静脈洞が三角形の高吸収で、近くに動脈の支配に合わない出血がある。対応は？","脳静脈洞血栓症の可能性として医師へ伝える",null,"静脈洞血栓症は見逃されやすく、抗凝固療法などの治療につながります。");
T("pres","妊娠中・産褥期の女性で PRES が疑われるときの注意点は？","妊娠の有無を確認し、造影剤を使うかどうかは医師の判断を確認する",["必ず造影 MRI を行う","妊娠の確認は不要","CT だけで十分"],"妊娠中は造影剤の使用を慎重に判断します。");
R("pres","産褥期の女性がけいれん。MRI で両側後頭葉に高信号があり、一部で ADC が低下している。対応は？","梗塞化の可能性を含めて医師へ伝える",null,"ADC 低下は可逆性の浮腫から梗塞に進んでいる可能性を示します。");

/* ---- 頭頸部 ---- */

T("ischemic-colitis","虚血性大腸炎で壊死型を疑う所見は？","腸管の壁内ガスや造影不良",["軽い壁肥厚だけ","腸管内の便","正常な造影効果"],"壊死型は手術が必要になることがあります。");
R("ischemic-colitis","虚血性大腸炎疑いの CT で、腸管壁内ガスと門脈内ガスがある。対応は？",NOW,null,"腸管壊死を示す所見です。");
T("intussusception","腸重積の長軸像（sausage sign）を見るのに有用なのは？","冠状断・矢状断の再構成",["骨条件","肺野条件","厚いスライスの横断"],"重なった腸管の長さや先進部が分かりやすくなります。");
R("intussusception","成人の腸重積の CT で、先進部に腫瘤があり、口側の腸管が拡張している。対応は？","腸閉塞を伴う所見として医師へ伝える",null,"成人の腸重積は腫瘍が原因のことが多く、手術が検討されます。");
T("sigmoid-volvulus","S 状結腸軸捻転の CT で、撮像範囲について注意することは？","拡張した腸管で腹部が大きくなるので、範囲を広めにとる",["範囲を上腹部だけにする","骨盤は入れなくてよい","スカウト像を撮らない"],"腹部全体が膨らむため、撮り漏れが起こりやすくなります。");
R("sigmoid-volvulus","高度の腹部膨満の高齢者。CT で S 状結腸がコーヒー豆状に拡張し、腸管壁内にガスがある。対応は？","壊死の可能性として直ちに医師へ伝える",null,"壊死があると内視鏡的整復ではなく手術になります。");
T("obturator-hernia","原因の分からない腸閉塞で閉鎖孔ヘルニアを見逃さないためには？","撮像範囲に骨盤底（恥骨の下縁）まで含める",["腎臓の高さまでで止める","上腹部だけを撮る","骨条件だけで見る"],"閉鎖孔は骨盤の最下部にあり、範囲が足りないと写りません。");
R("obturator-hernia","やせた高齢女性の腸閉塞。CT で右の閉鎖孔に腸管が入り込んでいる。対応は？","嵌頓ヘルニアとして直ちに医師へ伝える",null,"嵌頓は腸管壊死に進むため、早期の手術が必要です。");
T("crc","CT コロノグラフィ（大腸 CT）のポイントは？","十分な送気と、腹臥位・仰臥位の 2 体位で撮る",["送気せずに撮る","1 体位だけで撮る","便が残っていても前処置は不要"],"腸管を十分に広げ、残渣や液体の移動で病変を見分けます。");
R("crc","大腸癌の患者の CT で、腫瘍の口側の結腸が著しく拡張し、腹腔内に遊離ガスがある。対応は？","穿孔として直ちに医師へ伝える",null,"閉塞性大腸癌の穿孔は緊急手術の対象です。");
T("pancreatic-ca","膵癌の評価に適した造影プロトコルは？","膵実質相と門脈相の 2 相以上",["遅延相 1 相だけ","単純 CT だけ","肺野条件"],"膵実質相で腫瘍のコントラストが最大になり、門脈相で静脈浸潤や肝転移を評価します。");
R("pancreatic-ca","黄疸の患者。CT で膵頭部に乏血性の腫瘤と胆管拡張があり、高熱が出ている。対応は？","閉塞性胆管炎の合併の可能性として医師へ伝える",null,"胆管炎の合併は緊急の胆道ドレナージにつながります。");
T("rcc","腎腫瘤の造影効果を判定するのに必要なのは？","単純 CT を撮り、造影後との CT 値の差を見る",["造影 CT だけを撮る","肺野条件で見る","骨条件で見る"],"一般に 20 HU 以上の上昇で造影効果ありと判断します。");
R("rcc","健診で偶然見つかった腎腫瘤。患者さんは無症状。対応は？","通常の読影依頼の流れで報告する",ROUT_WRONG,"重要な所見ですが緊急ではありません。");
T("enterocolitis","感染性腸炎の患者を撮影したあとに必要なことは？","接触予防策に従い、寝台・装置を清拭する",["特に何もしない","次の患者をすぐ入れる","アルコールが効かない病原体でも同じ方法でよい"],"ノロウイルスなどはアルコールが効きにくく、施設の手順（次亜塩素酸など）に従います。");
R("enterocolitis","腸炎疑いの CT で、腸管壁内にガスがある。対応は？","腸管虚血の可能性として直ちに医師へ伝える",null,"腸管壁内ガスは虚血・壊死を示すことがあります。");
T("psoas-abscess","腸腰筋膿瘍で、原因として合併しやすい病変を確認するには？","骨条件で脊椎（化膿性脊椎炎）も評価する",["肺野条件だけ見る","頭部を撮る","単純 CT だけで終える"],"腸腰筋膿瘍は化膿性脊椎炎から広がることがよくあります。");
R("psoas-abscess","腸腰筋膿瘍の中にガスが多く、撮影中に患者の血圧が下がってきた。対応は？",NOW,null,"ガス産生菌による重症感染と敗血症性ショックの可能性があります。");
T("ovarian-torsion","若年女性の下腹部痛で CT を撮る前に確認すべきことは？","妊娠の可能性（妊娠反応の結果）",["最終の食事の時間だけ","身長","眼鏡の有無"],"妊娠の可能性は撮影の可否と方法を左右します。");
R("ovarian-torsion","下腹部痛の若年女性。CT で腫大した卵巣とねじれた茎がある。対応は？","卵巣を温存するには時間が重要なため、直ちに医師へ伝える",null,"茎捻転は時間がたつほど卵巣が壊死します。");
T("ectopic","異所性妊娠破裂が疑われ、ショック状態の患者を撮影するときに正しいのは？","急変に備えて医師・看護師と協力し、最短で撮影する",["一人で時間をかけて撮る","すべての時相を追加する","患者を待合室で待たせる"],"ショック時の撮影は、検査の利益とリスクを医師が判断し、チームで行います。");
R("ectopic","妊娠反応陽性の女性の腹痛。CT で骨盤内に高吸収の液体と付属器の輪状の腫瘤がある。対応は？","腹腔内出血として直ちに医師へ伝える",null,"破裂した異所性妊娠は緊急手術の対象です。");
T("myoma","子宮の MRI で腸管の動きによるぼけを抑える方法は？","禁忌を確認したうえで、医師の指示により鎮痙剤を使う",["技師の判断で鎮痙剤を使う","加算回数を減らす","スライスを厚くするだけ"],"鎮痙剤は緑内障・心疾患などの禁忌を確認して使います。");
R("myoma","子宮筋腫の経過観察 MRI。前回と変化がない。対応は？","通常の読影依頼の流れで報告する",ROUT_WRONG,"変化のない筋腫は待機的な所見です。");
T("fournier","壊死性軟部組織感染症の CT で、撮像範囲として適切なのは？","腹部から大腿まで広くとる",["会陰部だけ","骨盤の上半分だけ","胸部だけ"],"感染は筋膜に沿って急速に広がるため、範囲の把握が手術計画に必要です。");
R("fournier","会陰部の腫れと発熱のある糖尿病患者。CT で皮下や筋膜に沿ったガスがある。対応は？","緊急手術の対象になりうるため直ちに医師へ伝える",null,"壊死性軟部組織感染症は数時間で進行する緊急疾患です。");

</script>
<script>
/* ===== 準備 ===== */
CASES.sort((a,b) => REGIONS.indexOf(a.reg) - REGIONS.indexOf(b.reg));
const BY_ID = Object.fromEntries(CASES.map(c => [c.id, c]));
const TPL_MOD = {"head-vent":"CT","head-base":"CT","head-post":"CT","face-orbit":"CT","face-max":"CT","neck":"CTC","spine-l":"T2","spine-c":"T2","chest":"CTC","chest-heart":"CTC","chest-lung":"CTL","abd-upper":"CTC","abd-kidney":"CTC","abd-mid":"CTC","abd-low":"CTC","pelvis":"CTC","hip-cor":"CT","knee-sag":"PDFS","shoulder-cor":"T2"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const sevRank = {crit:0, urg:1, rout:2};

/* ===== 表示テーマ ===== */
function setTheme(t){
  document.documentElement.classList.remove("ui-dark","ui-light","ui-auto");
  document.documentElement.classList.add("ui-"+t);
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet===t)));
  store.set("ctmri-theme", t);
}
document.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => setTheme(b.dataset.themeSet));
setTheme(store.get("ctmri-theme","dark"));

/* ===== タブ ===== */
function showView(name){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view===name)));
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "view-"+name);
  if (name==="quiz" && !quizState.quiz) startQuiz("quiz");
  if (name==="report" && !quizState.report) startQuiz("report");
  window.scrollTo({top:0});
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => showView(b.dataset.view)));

/* ===== 症例図鑑 ===== */
const MGRP = m => m.startsWith("CT") ? "CT" : "MRI";
const MOD_ORDER = ["CT","CTC","CTL","CTB","T1","T1C","T1FS","T2","FLAIR","DWI","T2S","STIR","PDFS"];
const MOD_SHORT = {CT:"単純CT",CTC:"造影CT",CTL:"肺野条件",CTB:"骨条件",T1:"T1",T1C:"造影T1",T2:"T2",FLAIR:"FLAIR",DWI:"DWI（拡散強調）",T2S:"T2*",STIR:"STIR",PDFS:"脂肪抑制PD",T1FS:"脂肪抑制T1"};
let mod = "すべて";
const modHit = (v) => mod==="すべて" || (mod==="CT"||mod==="MRI" ? MGRP(v.m)===mod : v.m===mod);
let region = "すべて", query = "", current = CASES[0].id, viewIdx = 0, showAnn = true, showAnat = false;
function matches(c){
  if (region!=="すべて" && c.reg!==region) return false;
  if (!c.v.some(modHit)) return false;
  if (!query) return true;
  const hay = (c.name+" "+(c.alias||"")+" "+c.keys.join(" ")+" "+c.v.map(v=>(v.label||"")+" "+MOD_NAME[v.m]).join(" ")).toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function renderFilters(){
  const regions = ["すべて", ...REGIONS];
  $("#filters").innerHTML = regions.map(r => {
    const n = r==="すべて" ? CASES.length : CASES.filter(c=>c.reg===r).length;
    return `<button class="chip" aria-pressed="${r===region}" data-r="${r}">${r}<span class="n">${n}</span></button>`;
  }).join("");
  $("#filters").querySelectorAll("button").forEach(b => b.onclick = () => { region = b.dataset.r; renderFilters(); renderModFilter(); renderList(); });
}
function renderModFilter(){
  const inReg = CASES.filter(c => region==="すべて" || c.reg===region);
  const cnt = test => inReg.filter(c => c.v.some(test)).length;
  const grp = mod==="すべて" ? null : (mod==="CT"||mod==="MRI" ? mod : MGRP(mod));
  const top = ["すべて","CT","MRI"].map(g => {
    const n = g==="すべて" ? inReg.length : cnt(v=>MGRP(v.m)===g);
    const on = g===mod || (g===grp && mod!==g);
    return `<button class="chip" aria-pressed="${on}" data-m="${g}">${g==="すべて"?"すべてのモダリティ":g}<span class="n">${n}</span></button>`;
  }).join("");
  const subs = grp ? MOD_ORDER.filter(m => MGRP(m)===grp).map(m => [m, cnt(v=>v.m===m)]).filter(([,n])=>n) : [];
  $("#modfilter").innerHTML = `<span class="lab">モダリティ・撮像条件</span><div class="row">${top}</div>
    ${subs.length ? `<div class="row sub">${subs.map(([m,n])=>`<button class="chip" aria-pressed="${mod===m}" data-m="${m}">${MOD_SHORT[m]}<span class="n">${n}</span></button>`).join("")}</div>` : ""}`;
  $("#modfilter").querySelectorAll("button").forEach(b => b.onclick = () => {
    const m = b.dataset.m; mod = (m===mod && !["すべて","CT","MRI"].includes(m)) ? MGRP(m) : m;
    renderModFilter(); renderList();
    const first = CASES.find(matches); if (first && !CASES.filter(matches).some(c=>c.id===current)) openCase(first.id); else if (BY_ID[current]) openCase(current);
  });
}
function renderList(){
  const list = CASES.filter(matches);
  $("#count").textContent = `${list.length} 症例` + (mod!=="すべて" ? `（${mod==="CT"||mod==="MRI"?mod:MOD_SHORT[mod]} の画像あり）` : "");
  let html = "", last = "";
  list.forEach(c => {
    if (c.reg !== last && region==="すべて"){ html += `<div class="listhead">${c.reg}</div>`; last = c.reg; }
    html += `<button class="caseitem" aria-current="${c.id===current}" data-id="${c.id}">
      <span class="sev-${c.sev}"></span>
      <span><strong>${c.name}</strong><small>${SEV[c.sev]}${[...new Set(c.v.map(v=>MOD_SHORT[v.m]))].map(t=>`<span class="modtag">${t}</span>`).join("")}</small></span></button>`;
  });
  $("#caselist").innerHTML = html || `<p class="hint">該当する症例がありません。キーワードを変えてみてください。</p>`;
  $("#caselist").querySelectorAll(".caseitem").forEach(b => b.onclick = () => { openCase(b.dataset.id); if (innerWidth<860) $("#detail").scrollIntoView({behavior:"smooth"}); });
}
$("#q").addEventListener("input", e => { query = e.target.value.trim(); renderList(); });
function openCase(id){ current = id; const i = BY_ID[id].v.findIndex(modHit); viewIdx = i<0 ? 0 : i; renderList(); renderDetail(); }
const li = arr => `<ul>${arr.map(x=>`<li>${x}</li>`).join("")}</ul>`;
function renderDetail(){
  const c = BY_ID[current], v = c.v[viewIdx];
  const mods = [...new Set(c.v.map(x=>x.m.startsWith("CT")?"CT":"MRI"))].join(" / ");
  $("#detail").innerHTML = `
    <div class="dhead"><h2>${c.name}</h2>
      <span class="tag ${c.sev}">${SEV[c.sev]}</span><span class="tag">${c.reg}</span><span class="tag">${mods}</span></div>
    <div class="dgrid">
      <div class="imgpanel">
        <div class="scanwrap" id="scan">${renderView(v)}</div>
        ${c.v.length>1 ? `<div class="imgtools">${c.v.map((x,i)=>`<button class="chip" aria-pressed="${i===viewIdx}" data-i="${i}">${x.label||MOD_NAME[x.m]}</button>`).join("")}</div>` : ""}
        <div class="layer">
          <button class="find" id="tgAnn" aria-pressed="${showAnn}">所見</button>
          <button class="anatb" id="tgAnat" aria-pressed="${showAnat}">解剖</button>
        </div>
        <p class="tplname">${v.label||MOD_NAME[v.m]} ・ ${TPL[v.tpl].name}</p>
        <p class="wl">${v.wl||""}</p>
        <p class="caption">${v.cap}</p>
      </div>
      <div class="sections">
        <section><h3>典型的な症状・背景</h3>${li(c.sx)}
          ${c.keys.length ? `<div class="keychips" style="margin-top:6px">${c.keys.map(k=>`<button class="chip" data-key="${k}">${k}</button>`).join("")}</div>` : ""}</section>
        <section><h3>CT の所見</h3>${li(c.ct)}</section>
        <section><h3>MRI の所見</h3>${li(c.mri)}</section>
        <section class="tech"><h3>技師のポイント（撮像・表示）</h3>${li(c.tech)}</section>
        <section class="alert"><h3>見逃し注意・すぐ医師に伝えたい所見</h3>${li(c.rep)}</section>
        <section><h3>鑑別・まぎらわしいもの</h3>${li(c.ddx)}</section>
      </div>
    </div>`;
  applyLayers();
  $("#tgAnn").onclick = () => { showAnn = !showAnn; $("#tgAnn").setAttribute("aria-pressed", showAnn); applyLayers(); };
  $("#tgAnat").onclick = () => { showAnat = !showAnat; $("#tgAnat").setAttribute("aria-pressed", showAnat); applyLayers(); };
  $("#detail").querySelectorAll(".imgtools .chip").forEach(b => b.onclick = () => { viewIdx = +b.dataset.i; renderDetail(); });
  $("#detail").querySelectorAll(".keychips .chip").forEach(b => b.onclick = () => { selSym = new Set([b.dataset.key]); renderSymptom(); showView("symptom"); });
}
function applyLayers(){ const s = $("#scan svg"); s.classList.toggle("show-ann", showAnn); s.classList.toggle("show-anat", showAnat); }

/* ===== 症状から探す ===== */
let selSym = new Set();
function renderSymptom(){
  $("#symchips").innerHTML = SYMPTOM_GROUPS.map(([g, keys]) => `
    <div class="symgroup"><h3>${g}</h3><div class="chips">
      ${keys.map(k => `<button class="chip" aria-pressed="${selSym.has(k)}" data-k="${k}">${k}</button>`).join("")}
    </div></div>`).join("");
  $("#symchips").querySelectorAll("button").forEach(b => b.onclick = () => { selSym.has(b.dataset.k) ? selSym.delete(b.dataset.k) : selSym.add(b.dataset.k); renderSymptom(); });
  $("#symselected").innerHTML = selSym.size
    ? [...selSym].map(k=>`<button class="chip" aria-pressed="true" data-k="${k}">${k} ×</button>`).join("") + `<button class="btn ghost" id="symclear" style="padding:2px 10px;font-size:.8rem">すべて解除</button>`
    : `<span class="hint">左の一覧から症状を選んでください（複数選択できます）。</span>`;
  $("#symselected").querySelectorAll(".chip").forEach(b => b.onclick = () => { selSym.delete(b.dataset.k); renderSymptom(); });
  if ($("#symclear")) $("#symclear").onclick = () => { selSym.clear(); renderSymptom(); };
  if (!selSym.size){ $("#symresults").innerHTML = ""; return; }
  const scored = CASES.map(c => { const hit = c.keys.filter(k => selSym.has(k)); return {c, hit}; })
    .filter(x => x.hit.length)
    .sort((a,b) => b.hit.length - a.hit.length || sevRank[a.c.sev] - sevRank[b.c.sev]);
  const n = selSym.size;
  $("#symresults").innerHTML = scored.length ? scored.slice(0,30).map(({c,hit}) => `
    <button class="result-item" data-id="${c.id}">
      <span class="sev-${c.sev}" style="align-self:stretch"></span>
      <span><strong>${c.name}</strong><small>${SEV[c.sev]} ・ ${c.reg} ・ 一致：${hit.join("、")}</small>
        <div class="bar"><span style="width:${Math.round(hit.length/n*100)}%"></span></div></span>
      <span class="match">${hit.length}/${n}</span>
    </button>`).join("") : `<p class="hint">一致する症例がありません。</p>`;
  $("#symresults").querySelectorAll(".result-item").forEach(b => b.onclick = () => { openCase(b.dataset.id); showView("atlas"); });
}

/* ===== クイズ ===== */
const QTYPES = {img:"画像 → 疾患", sym:"症状 → 疾患", anat:"解剖", tech:"撮像のポイント"};
let qTypes = new Set(store.get("ctmri-qtypes", ["img","sym","anat","tech"])), qRegion = "すべて";
function renderSetup(){
  $("#qsetup").innerHTML = `
    <fieldset><legend>出題の種類</legend><div class="filters">${Object.entries(QTYPES).map(([k,l])=>`<button class="chip" aria-pressed="${qTypes.has(k)}" data-t="${k}">${l}</button>`).join("")}</div></fieldset>
    <fieldset><legend>範囲</legend><div class="filters">${["すべて",...REGIONS].map(r=>`<button class="chip" aria-pressed="${r===qRegion}" data-r="${r}">${r}</button>`).join("")}</div></fieldset>`;
  $("#qsetup").querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    const t = b.dataset.t; if (qTypes.has(t) && qTypes.size>1) qTypes.delete(t); else qTypes.add(t);
    store.set("ctmri-qtypes",[...qTypes]); renderSetup(); startQuiz("quiz"); });
  $("#qsetup").querySelectorAll("[data-r]").forEach(b => b.onclick = () => { qRegion = b.dataset.r; renderSetup(); startQuiz("quiz"); });
}
const quizState = {};
let rRegion = "すべて";
function renderRSetup(){
  $("#rsetup").innerHTML = `<fieldset><legend>範囲（${CASES.filter(c=>c.repQ).length} 問から 10 問）</legend><div class="filters">${["すべて",...REGIONS].map(r=>`<button class="chip" aria-pressed="${r===rRegion}" data-r="${r}">${r}</button>`).join("")}</div></fieldset>`;
  $("#rsetup").querySelectorAll("[data-r]").forEach(b => b.onclick = () => { rRegion = b.dataset.r; renderRSetup(); startQuiz("report"); });
}
function pickOthers(c, pool, n=3){
  const same = shuffle(pool.filter(o => o.id!==c.id && o.reg===c.reg));
  const rest = shuffle(pool.filter(o => o.id!==c.id && o.reg!==c.reg));
  return [...same, ...rest].slice(0,n);
}
function buildPool(mode){
  if (mode==="report")
    return shuffle(CASES.filter(c=>c.repQ && (rRegion==="すべて" || c.reg===rRegion))).slice(0,10).map(c => ({kind:"緊急所見への対応", c, img:renderView(c.v[0]), ann:true, ...c.repQ}));
  const pool = [], dz = CASES.filter(c => c.reg!=="アーチファクト");
  const inR = c => qRegion==="すべて" || c.reg===qRegion;
  if (qTypes.has("img")) dz.filter(inR).forEach(c => {
    const opts = shuffle([c.name, ...pickOthers(c, dz).map(o=>o.name)]);
    pool.push({kind:QTYPES.img, c, img:renderView(c.v[0]), ann:false, q:"この模式図で最も考えられる疾患は？", opts, a:opts.indexOf(c.name), exp:c.v[0].cap});
  });
  if (qTypes.has("sym")) dz.filter(inR).forEach(c => {
    const opts = shuffle([c.name, ...pickOthers(c, dz).map(o=>o.name)]);
    pool.push({kind:QTYPES.sym, c, img:null, stem:c.sx.join(" ／ "), q:"この症状・背景から最も考えたい疾患は？", opts, a:opts.indexOf(c.name),
      exp:`${c.name}の典型像です。画像では「${c.ct[0]}」などを確認します。`});
  });
  if (qTypes.has("anat")){
    const regTpl = {"頭部":["head-vent","head-base","head-post"],"頭頸部":["face-orbit","face-max","neck"],"脊椎":["spine-l","spine-c"],"胸部":["chest","chest-heart","chest-lung"],"腹部・骨盤":["abd-upper","abd-kidney","abd-mid","abd-low","pelvis"],"骨・関節":["hip-cor","knee-sag","shoulder-cor"]};
    const tpls = qRegion==="すべて" ? Object.keys(TPL_MOD) : regTpl[qRegion];
    tpls.forEach(t => { const an = anatOf(t); shuffle(an.map((_,i)=>i)).slice(0,3).forEach(i => {
      const name = an[i][4], others = shuffle(an.filter((_,j)=>j!==i).map(x=>x[4])).slice(0,3), opts = shuffle([name,...others]);
      pool.push({kind:QTYPES.anat, c:null, tpl:t, img:renderView({tpl:t,m:TPL_MOD[t]},{hl:i}), q:"丸で示した構造はどれ？", opts, a:opts.indexOf(name),
        exp:`${TPL[t].name}の「${name}」です。`, anatAfter:renderView({tpl:t,m:TPL_MOD[t]})});
    }); });
  }
  if (qTypes.has("tech")) CASES.filter(c=>c.techQ && inR(c)).forEach(c => pool.push({kind:QTYPES.tech, c, img:null, ...c.techQ}));
  return shuffle(pool).slice(0,10);
}
function startQuiz(mode){
  const qs = buildPool(mode).map(q => { const order = shuffle(q.opts.map((_,i)=>i)); return {...q, opts:order.map(i=>q.opts[i]), a:order.indexOf(q.a)}; });
  quizState[mode] = {qs, i:0, score:0, wrong:[]};
  renderQ(mode);
}
const rootOf = mode => $(`#${mode==="quiz"?"quiz":"report"}-root`);
function renderQ(mode){
  const st = quizState[mode], root = rootOf(mode);
  if (!st.qs.length){ root.innerHTML = `<p class="hint">この条件では出題できる問題がありません。種類か範囲を変えてください。</p>`; return; }
  if (st.i >= st.qs.length) return renderResult(mode);
  const q = st.qs[st.i];
  root.innerHTML = `
    <div class="qbar"><span class="progress">問 ${st.i+1} / ${st.qs.length}　正解 ${st.score}</span>
      <button class="btn ghost" id="${mode}-restart">問題を入れ替える</button></div>
    <div class="qcard ${q.img?"":"noimg"}">
      ${q.img ? `<div class="scanwrap" id="${mode}-img">${q.img}</div>` : ""}
      <div>
        <div class="kind">${q.kind}</div>
        ${q.stem ? `<p class="stem">${esc(q.stem)}</p>` : ""}
        <h2>${esc(q.q)}</h2>
        <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
        <div id="${mode}-fb"></div>
      </div>
    </div>`;
  if (q.img && q.ann) root.querySelector("svg").classList.add("show-ann");
  $(`#${mode}-restart`).onclick = () => startQuiz(mode);
  root.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(mode, +b.dataset.i));
}
function answer(mode, i){
  const st = quizState[mode], q = st.qs[st.i], root = rootOf(mode);
  const ok = i===q.a; if (ok) st.score++; else st.wrong.push(q);
  root.querySelectorAll(".opt").forEach((b,j) => { b.disabled = true; if (j===q.a) b.classList.add("correct"); else if (j===i) b.classList.add("wrong"); });
  if (q.anatAfter){ $(`#${mode}-img`).innerHTML = q.anatAfter; $(`#${mode}-img svg`).classList.add("show-anat"); }
  else if (q.img) root.querySelector("svg").classList.add("show-ann");
  $(`#${mode}-fb`).innerHTML = `<div class="feedback"><b class="${ok?"good":"bad"}">${ok?"正解です。":"惜しい。"}</b> ${esc(q.exp)}</div>
    <div class="actions"><button class="btn" id="${mode}-next">${st.i+1<st.qs.length?"次の問題へ":"結果を見る"}</button>
    ${q.c ? `<button class="btn ghost" id="${mode}-see">「${q.c.name}」を図鑑で見る</button>` : ""}</div>`;
  $(`#${mode}-next`).onclick = () => { st.i++; renderQ(mode); };
  if (q.c) $(`#${mode}-see`).onclick = () => { openCase(q.c.id); showView("atlas"); };
  $(`#${mode}-next`).focus();
}
function renderResult(mode){
  const st = quizState[mode], root = rootOf(mode);
  const key = "ctmri-best-"+mode, best = Math.max(store.get(key,0), st.score); store.set(key,best);
  const weak = [...new Map(st.wrong.filter(q=>q.c).map(q=>[q.c.id,q.c])).values()];
  const anatMiss = st.wrong.filter(q=>q.tpl).length;
  root.innerHTML = `<div class="result">
    <div class="score">${st.score} / ${st.qs.length}</div>
    <p>これまでの最高：${best} / ${st.qs.length}</p>
    ${weak.length ? `<p>復習するとよい症例：</p><ul>${weak.map(c=>`<li><a href="#" data-id="${c.id}">${c.name}</a></li>`).join("")}</ul>` : ""}
    ${anatMiss ? `<p>解剖の問題で ${anatMiss} 問まちがえました。図鑑の「解剖」ボタンで構造を確認できます。</p>` : ""}
    ${!weak.length && !anatMiss ? "<p>全問正解です。</p>" : ""}
    <div class="actions"><button class="btn" id="${mode}-again">もう一度挑戦する</button></div></div>`;
  $(`#${mode}-again`).onclick = () => startQuiz(mode);
  root.querySelectorAll("a[data-id]").forEach(a => a.onclick = e => { e.preventDefault(); openCase(a.dataset.id); showView("atlas"); });
}

renderFilters(); renderModFilter(); renderList(); renderDetail(); renderSymptom(); renderSetup(); renderRSetup();
</script>
